<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Jahgenda · Reggae-Shows in der Schweiz</title>
    <meta name="description" content="Kommende Reggae-, Dub- und Ska-Shows in der Schweiz." />
    <meta name="theme-color" content="#14110e" />
    <link rel="canonical" href="https://markusbaumg.github.io/jahgenda/" />
    <!-- Link previews (WhatsApp, Signal, Slack …): title, text and the app icon. Static, as every
         share link points at this one page. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://markusbaumg.github.io/jahgenda/" />
    <meta property="og:title" content="Jahgenda – Reggae, Dub & Ska in der Schweiz" />
    <meta property="og:description" content="Kommende Reggae-, Dub- und Ska-Shows in der Schweiz." />
    <meta property="og:locale" content="de_CH" />
    <meta property="og:image" content="https://markusbaumg.github.io/jahgenda/img/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <!-- PNG first: Safari (before 26) ignores SVG favicons and would otherwise ask for /favicon.ico. -->
    <link rel="icon" href="img/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="img/logo/jahgenda.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- No preload for the JSON: WebKit never matches <link rel=preload as=fetch> against fetch() and
         downloaded shows.json and genres.json twice on every load (Chromium gained a few ms at most). -->
    <!-- Karte: Leaflet and the tiles come from two other origins; the handshakes start now, not on the tap. -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jahgenda" />
    <!-- The display face lives in public/ (not hashed), so the preload URL is stable across builds. -->
    <link rel="preload" href="img/fonts/jahdisplay.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The stylesheet is imported by src/main.js; Vite links the built CSS here. -->
  </head>
  <body>
    <!-- One of the slogans per page load, picked by the header component before the first paint. The same
         lines go on the stickers: data/slogans.json – tests/test_contract.py keeps the two lists equal.
         The first one is the default. -->
    <script type="application/json" id="slogans">
      [
        "Reggae, Dub & Ska in der Schweiz",
        "Alli Reggae-Shows. Ei Site.",
        "Jah weiss, wo's lauft.",
        "Kei Show meh verpasse.",
        "Dub. Ska. Reggae. Alles uf eim Blatt.",
        "Vo Genf bis Chur: alli Riddims.",
        "Hüt Abig Reggae? Lueg nah.",
        "Dis Soundsystem für d'Agenda.",
        "Roots, Rock, Reggae – und du mittedrin.",
        "Wo lauft Dub? Jahgenda weiss es.",
        "Ei Site. Alli Bässe.",
        "Skank it. Jede Wuche neu.",
        "Vom Club bis zum Openair – alles drin.",
        "Irie Abig gsuecht? Gfunde.",
        "Reggae-Agenda für d'Schwiiz. Ohni Bullshit."
      ]
    </script>
    <div id="app"></div>
    <!-- Plain scripts from public/ until the later stories move them into src/: the storage abstraction
         (window.jahStore) and the PWA glue (service worker + update toast). The callouts and the install
         nudge are in src/ (components/callout). -->
    <script src="store.js"></script>
    <script src="pwa.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
