# Nur Konfiguration – das Projekt hat keine Python-Abhängigkeiten (stdlib only).
# `make lint` nutzt ruff, falls installiert (pip install ruff), sonst python3 -m py_compile.

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["scripts", "tests"]

[tool.ruff.lint]
# Explizit statt «Defaults», damit ein ruff-Update nicht plötzlich neue Regeln bringt:
# Syntax/Logik (E4, E7, E9, F), zu lange Zeilen (E501), Whitespace (W), Import-Reihenfolge (I).
select = ["E4", "E7", "E9", "F", "E501", "W", "I"]

[tool.ruff.format]
quote-style = "double"
