name: Scraper watchdog

on:
  schedule:
    # 06:17 UTC = 08:17 CEST / 07:17 CET. GitHub cron is UTC only; avoid :00 (high-load, delays).
    - cron: "17 6 * * *"
    # Second fire at noon UTC: GitHub drops or delays scheduled runs at busy hours (the 06:17 fire was
    # skipped on 2026-10-13); the script is idempotent, so a second pass never duplicates the issue.
    - cron: "17 12 * * *"
    # 20:17 Zurich (18:17 UTC): a 06:06 run that never happened is flagged the same evening (#58).
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check data freshness and sync the scraper-failed issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_AGE_HOURS: "30"
        run: python3 scripts/check_freshness.py --max-age-hours "$MAX_AGE_HOURS"
