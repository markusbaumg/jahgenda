# Läuft bei jedem Push und Pull Request: `make ci` = lint (node, ruff, prettier) + validate + test + Datenformat.
# Entspricht `make check` lokal. Das Deploy (pages.yml) validiert die Daten zusätzlich nochmals vor dem Upload.
name: CI

on:
  pull_request:
  push:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # node ist auf ubuntu-latest vorinstalliert; prettier kommt per npx. setup-python liefert ein pip, in das
      # sich ruff ohne «externally-managed-environment»-Fehler installieren lässt (ruff ist ein Einzelbinary).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install ruff
        run: pip install --quiet ruff
      - name: make ci
        run: make ci
