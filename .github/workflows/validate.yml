# Runs on every push and pull request: `make ci` = lint (node, ruff, prettier) + validate + test
# + smoke (headless Chrome, skipped when absent) + data format.
# Same as `make check` locally. The deploy (pages.yml) validates the data once more before uploading.
# A second job runs the Playwright end-to-end tests (e2e/, same as `make e2e`) – deliberately not part
# of `make check`, it needs a browser download and the network (Leaflet, OSM tiles).
name: CI

on:
  pull_request:
  push:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install ruff
        run: pip install --quiet ruff
      - name: make ci
        run: make ci

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
