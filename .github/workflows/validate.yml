# Runs on every push and pull request: `make ci` = lint (node, ruff, prettier) + validate + test
# + smoke (headless Chrome, skipped when absent) + data format.
# Same as `make check` locally. The deploy (pages.yml) validates the data once more before uploading.
name: CI

on:
  pull_request:
  push:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install ruff
        run: pip install --quiet ruff
      - name: make ci
        run: make ci
