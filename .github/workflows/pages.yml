name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate data before deploying
        run: python3 scripts/validate_shows.py --allow-past
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # The build copies data/ into dist/data and stamps sw.js with a hash of the app shell (the
      # jahgenda-static plugin in vite.config.js), so a new shell gets a new cache.
      - name: Build the page (vite build → dist/)
        run: npm ci --no-fund --no-audit && npm run build
      - name: Build calendar feeds (jahgenda.ics + per canton) into dist/
        run: python3 scripts/make_ics.py dist
      - name: Check the service worker stamp
        run: grep -q 'const BUILD = "__BUILD__"' dist/sw.js && exit 1 || grep -o 'const BUILD = "[0-9a-f]*"' dist/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
