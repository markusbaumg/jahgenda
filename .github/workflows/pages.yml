name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate data before deploying
        run: python3 scripts/validate_shows.py --allow-past
      - name: Stamp service worker with a hash of the app shell
        run: |
          BUILD=$(cat index.html log.html style.css app.js pwa.js manifest.webmanifest | sha256sum | cut -c1-10)
          sed -i "s/__BUILD__/$BUILD/" sw.js && grep -q "$BUILD" sw.js && echo "build $BUILD"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
