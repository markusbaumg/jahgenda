# Weekly: one issue listing what the scraper dropped (so the owners can check for false negatives) and
# the dead links on the page.
name: Quality review

on:
  schedule:
    - cron: "33 6 * * 1" # Monday 08:33 Zurich (CEST)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # --links: also check every show/ticket/venue link (scripts/check_links.py; 404/410/DNS count as dead).
      - name: Open the weekly quality-review issue (dropped candidates + dead links)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/quality_review.py --days 7 --links
